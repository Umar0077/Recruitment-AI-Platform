# Nginx site for the InterviewOS API. Install as a NEW file (e.g. /etc/nginx/sites-available/interviewos-api.conf);
# do not edit other sites. Test with `nginx -t` and reload only nginx (`systemctl reload nginx`).
# Replace api.interviews.example.com and the certificate paths.

limit_req_zone $binary_remote_addr zone=interviewos_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.interviews.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.interviews.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.interviews.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.interviews.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 1m;
    proxy_read_timeout 30s;
    server_tokens off;

    # Never write Authorization headers or bodies to the access log.
    access_log /var/log/nginx/interviewos-api.access.log combined;

    # API docs: office/VPN addresses only (also requires SWAGGER_ENABLED=true on the backend).
    location /api/docs {
        allow 203.0.113.10;   # replace with your office/VPN IP
        deny all;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/snippets/interviewos-proxy.conf;
    }

    location /api/ {
        limit_req zone=interviewos_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/snippets/interviewos-proxy.conf;
    }

    location / { return 404; }
}
